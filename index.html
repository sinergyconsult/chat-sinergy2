<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinergy Consult - Asistente de Ciberseguridad</title>
    <style>
        /* Reset y fondo igual que la home */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #030a16; /* mismo fondo oscuro de Sinergy */
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* Contenedor del iframe con sombra y bordes redondeados */
        .iframe-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #030a16;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }

        /* ESTILOS QUE SE APLICAN AL CONTENIDO DEL IFRAME (vía inyección) */
        /* Nota: como el iframe es cross-origin, esto solo funciona si Botpress permite personalización vía URL */
        /* Alternativa: usar el parámetro &customCss= en la URL de Botpress (si está habilitado) */
    </style>
</head>
<body>
    <div class="iframe-wrapper">
        <!-- Agregamos parámetro para intentar personalizar (algunas versiones lo soportan) -->
        <iframe 
            src="https://cdn.botpress.cloud/webchat/v3.7/shareable.html?configUrl=https://files.bpcontent.cloud/2026/07/18/22/20260718220928-9RNHQNIA.json&theme=dark&primaryColor=%23f5c842&backgroundColor=%23030a16&fontColor=%23ffffff">
        </iframe>
    </div>
</body>
</html>
