<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinergy Consult - Entorno de Pruebas Corporativo</title>
    <style>
        /* 1. Fondo general de la web con el papel tapiz de la esfera repetido sutilmente */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            background-color: #fff8f4; 
            background-image: url('image_rFCP5z.png.png'); 
            background-repeat: repeat;
            background-size: 110px; 
            background-blend-mode: multiply; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* 2. Contenedor para el Logo Corporativo Superior */
        .logo-header {
            margin-bottom: 25px; 
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        .logo-header img {
            max-height: 55px; 
            width: auto;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.05)); 
        }

        /* 3. Tarjeta central flotante EXPANDIDA A LO ANCHO */
        .chat-wrapper {
            width: 95%;        /* Estira el cuadro usando casi todo el espacio de izquierda a derecha */
            height: 75%;       /* Mantiene la altura equilibrada */
            max-width: 1450px; /* Permite que el chat se expanda horizontalmente de forma masiva */
            max-height: 750px; /* Bloquea la altura para que NO crezca hacia abajo */
            background-color: #ffffff;
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(255, 102, 0, 0.15); 
            overflow: hidden;
            border: 1px solid rgba(255, 102, 0, 0.15); 
            animation: slideUp 0.8s ease-out;
            display: flex !important; /* Fuerza la alineación interna */
        }

        /* 4. Estilos visuales del iframe (Aquí NO va el link, solo las dimensiones físicas) */
        iframe {
            width: 100% !important;   /* Fuerza al bot a ocupar todo el ancho de la tarjeta blanca */
            height: 100% !important;  /* Fuerza al bot a ocupar todo el alto de la tarjeta blanca */
            min-width: 100% !important; 
            border: none;
            background: transparent;
        }

        /* Animaciones estéticas de carga */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- Cabecera con tu Logotipo Completo (Nombre + Esfera) -->
    <div class="logo-header">
        <img src="image_fcq80K.png.png" alt="Sinergy Consult Logo">
    </div>

    <!-- Contenedor del Chatbot (Aquí SÍ está tu enlace real e intacto) -->
    <div class="chat-wrapper">
        <iframe src="https://cdn.botpress.cloud/webchat/v3.7/shareable.html?configUrl=https://files.bpcontent.cloud/2026/07/18/22/20260718220928-9RNHQNIA.json"></iframe>
    </div>

</body>
</html>
